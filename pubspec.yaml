version: 0.1.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.5.0
  shimmer: ^3.0.0
  firebase_core: ^4.2.0

dev_dependencies:
